services:
  - type: web
    name: kdc-order-importer-web
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SHOPIFY_API_VERSION
        value: 2026-07
      - key: SCOPES
        value: read_products,write_products,read_customers,write_customers,read_orders,write_orders,write_order_edits,read_all_orders
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SHOP_CUSTOM_DOMAIN
        value: keraladiecastcars.myshopify.com
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
